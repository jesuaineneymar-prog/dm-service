# JARVIS Cron - GitHub Actions

name: JARVIS Cron

on:
  push:
    branches: [main]
    paths: ['.github/workflows/jarvis-cron.yml']
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    name: DM Monitor
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Monitorizar DMs
        run: curl -sSf "${{ secrets.JARVIS_URL }}/api/cron/monitor?secret=${{ secrets.CRONS_SECRET }}" && echo "OK" || echo "FALHOU"

  followups:
    name: Follow-ups
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verificar minuto
        id: m
        run: echo "r=$(($(date +%M) % 30 == 0 ? 1 : 0))" >> "$GITHUB_OUTPUT"
      - name: Processar
        if: steps.m.outputs.r == '1'
        run: curl -sSf "${{ secrets.JARVIS_URL }}/api/cron/followups?secret=${{ secrets.CRONS_SECRET }}" && echo "OK" || echo "SKIP"

  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verificar minuto
        id: m
        run: echo "r=$(($(date +%M) % 10 == 0 ? 1 : 0))" >> "$GITHUB_OUTPUT"
      - name: Publicar
        if: steps.m.outputs.r == '1'
        run: curl -sSf "${{ secrets.JARVIS_URL }}/api/cron/publish?secret=${{ secrets.CRONS_SECRET }}" && echo "OK" || echo "SKIP"
