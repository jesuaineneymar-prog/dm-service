# JARVIS Cron - GitHub Actions
name: JARVIS Cron

on:
  push:
    branches: [main]
    paths: ['.github/workflows/jarvis-cron.yml']
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    name: DM Monitor
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      JARVIS_URL: ${{ secrets.JARVIS_URL }}
      CRON_KEY: ${{ secrets.CRON_SECRET }}
    steps:
      - run: curl -sSf "${JARVIS_URL}/api/cron/monitor?secret=${CRON_KEY}"

  followups:
    name: Follow-ups
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      JARVIS_URL: ${{ secrets.JARVIS_URL }}
      CRON_KEY: ${{ secrets.CRON_SECRET }}
    steps:
      - run: |
          M=$(date +%M)
          test $((M % 30)) -eq 0 && curl -sSf "${JARVIS_URL}/api/cron/followups?secret=${CRON_KEY}" || true

  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      JARVIS_URL: ${{ secrets.JARVIS_URL }}
      CRON_KEY: ${{ secrets.CRON_SECRET }}
    steps:
      - run: |
          M=$(date +%M)
          test $((M % 10)) -eq 0 && curl -sSf "${JARVIS_URL}/api/cron/publish?secret=${CRON_KEY}" || true
