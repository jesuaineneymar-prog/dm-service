# JARVIS Cron - GitHub Actions

name: JARVIS Cron

on:
  push:
    branches: [main]
    paths: ['.github/workflows/jarvis-cron.yml']
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    name: DM Monitor
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Monitorizar DMs
        env:
          URL: ${{ secrets.JARVIS_URL }}
          KEY: ${{ secrets.CRONS_SECRET }}
        run: curl -sSf "$URL/api/cron/monitor?secret=$KEY" && echo "OK" || echo "FALHOU"

  followups:
    name: Follow-ups
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check minute
        id: m
        run: |
          M=$(date +%M)
          if [ $((M % 30)) -eq 0 ]; then echo "r=1" >> "$GITHUB_OUTPUT"; else echo "r=0" >> "$GITHUB_OUTPUT"; fi
      - name: Processar
        if: steps.m.outputs.r == '1'
        env:
          URL: ${{ secrets.JARVIS_URL }}
          KEY: ${{ secrets.CRONS_SECRET }}
        run: curl -sSf "$URL/api/cron/followups?secret=$KEY" && echo "OK" || echo "SKIP"

  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check minute
        id: m
        run: |
          M=$(date +%M)
          if [ $((M % 10)) -eq 0 ]; then echo "r=1" >> "$GITHUB_OUTPUT"; else echo "r=0" >> "$GITHUB_OUTPUT"; fi
      - name: Publicar
        if: steps.m.outputs.r == '1'
        env:
          URL: ${{ secrets.JARVIS_URL }}
          KEY: ${{ secrets.CRONS_SECRET }}
        run: curl -sSf "$URL/api/cron/publish?secret=$KEY" && echo "OK" || echo "SKIP"
